<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020602">
<title>Терминал // Испытание</title>
<style>
  :root{
    --bg:#020602;
    --green:#00ff66;
    --green-dim:#00b347;
    --green-dark:#0b3a1c;
    --red:#ff3b5c;
    --amber:#ffd166;
    --text:#c4ffd9;
    --mono:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);font-family:var(--mono);
    -webkit-tap-highlight-color:transparent;overflow-x:hidden;
  }
  #rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.3}
  .fx{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:
      repeating-linear-gradient(to bottom,transparent 0 2px,rgba(0,0,0,.22) 3px),
      radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.85) 100%);}

  .wrap{position:relative;z-index:2;min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:16px 16px max(16px,env(safe-area-inset-bottom));}

  .term{width:100%;max-width:440px;background:rgba(0,14,5,.9);
    border:1px solid var(--green-dim);
    box-shadow:0 0 30px rgba(0,255,102,.18),inset 0 0 40px rgba(0,255,102,.05);
    animation:pop .5s ease-out}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .term.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

  .bar{display:flex;align-items:center;gap:8px;padding:8px 12px;
    border-bottom:1px solid var(--green-dark);font-size:12px;color:var(--green-dim)}
  .dots{display:flex;gap:6px}
  .dots i{width:10px;height:10px;border-radius:50%;border:1px solid var(--green-dim)}
  .bar span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .body{padding:22px 20px 20px}
  .brand{display:block;margin:0 auto 18px;padding-bottom:16px;border-bottom:1px dashed var(--green-dark);text-align:center}
  .brand img{width:100%;max-width:260px;height:auto;display:inline-block;
    filter:drop-shadow(0 0 6px rgba(0,255,102,.15))}
  h1{font-size:20px;color:var(--green);letter-spacing:.12em;text-align:center;
    text-shadow:0 0 10px rgba(0,255,102,.6);margin-bottom:6px}
  .sub{text-align:center;font-size:12px;color:var(--green-dim);margin-bottom:18px}

  .log{font-size:12.5px;line-height:1.65;color:var(--green-dim);min-height:64px;margin-bottom:18px}
  .log .ok{color:var(--green)} .log .warn{color:var(--amber)} .log .err{color:var(--red)}
  .cur{display:inline-block;width:8px;height:14px;background:var(--green);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  label{display:block;font-size:12px;color:var(--green-dim);margin-bottom:6px;letter-spacing:.08em}
  .field{display:flex;align-items:center;border:1px solid var(--green-dark);background:rgba(0,0,0,.5);
    transition:border-color .2s,box-shadow .2s}
  .field:focus-within{border-color:var(--green);box-shadow:0 0 12px rgba(0,255,102,.25)}
  .field b{padding:0 10px;color:var(--green);font-weight:normal}
  input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--green);
    font:16px var(--mono);padding:13px 12px 13px 0;caret-color:var(--green)}
  input::placeholder{color:#2c6b44}

  button{width:100%;margin-top:14px;padding:14px;font:600 15px var(--mono);letter-spacing:.2em;
    color:var(--bg);background:var(--green);border:0;cursor:pointer;
    box-shadow:0 0 16px rgba(0,255,102,.35);transition:filter .15s,transform .05s}
  button:hover{filter:brightness(1.1)} button:active{transform:translateY(1px)}
  button:disabled{opacity:.6;cursor:wait}

  .status{display:flex;justify-content:space-between;margin-top:14px;font-size:11.5px;color:var(--green-dim)}
  .hint{margin-top:12px;font-size:12px;color:var(--amber);min-height:1em;line-height:1.5}

  /* экран победы */
  .win{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
    padding:16px;background:rgba(0,10,3,.92)}
  .win.show{display:flex;animation:pop .4s ease-out}
  .card{max-width:460px;width:100%;text-align:center;border:1px solid var(--green);padding:28px 22px;
    background:rgba(0,20,8,.95);box-shadow:0 0 40px rgba(0,255,102,.3)}
  .card h2{font-size:24px;color:var(--green);letter-spacing:.15em;margin-bottom:12px;
    text-shadow:0 0 14px rgba(0,255,102,.8)}
  .card p{font-size:14px;line-height:1.6;margin-bottom:10px}
  .card .stat{color:var(--green-dim);font-size:12.5px}
  .card a{color:var(--green)}

  @media (max-width:380px){
    .brand img{max-width:210px}
    .body{padding:18px 14px 16px} h1{font-size:17px}
  }
</style>
</head>

      <h1>ИСПЫТАНИЕ</h1>
      <p class="sub">Подбери код доступа и введи его ниже</p>

      <div class="log" id="log"></div>

      <form id="form" autocomplete="off">
        <label for="code">&gt; КОД ДОСТУПА</label>
        <div class="field"><b>$</b>
          <input id="code" type="text" placeholder="flag{...}" spellcheck="false"
                 autocapitalize="off" autocorrect="off" enterkeyhint="go">
        </div>
        <button type="submit" id="btn">ВВЕСТИ</button>
      </form>

      <div class="status"><span id="tries">Попыток: 0</span><span id="state">Ожидание ввода</span></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
</div>

<div class="win" id="win">
  <div class="card">
    <h2>ДОСТУП ОТКРЫТ</h2>
    <p>Поздравляем! Ты справился с испытанием.</p>
    <p>Приходи к нам на стажировку — такие люди нам нужны.</p>
    <!-- Замените на свои контакты: -->
    <p><a href="#">Ссылка на анкету / контакты</a></p>
    <p class="stat" id="winStat"></p>
  </div>
</div>

<script>
/* ===================== НАСТРОЙКИ ===================== */
// SHA-256 правильных ответов (в нижнем регистре). Можно указать несколько.
// Пример ниже — хэш от "flag{welcome_to_internship}".
const ANSWER_HASHES = [
  "3a9f264500e8ce57e2867146e27a2fc1cbea9e1c17fbc3fd3923aba9458d32ca",
];
// Подсказки: после какого числа неудачных попыток что показать.
const HINTS = {
  3:  "Подсказка: ответ имеет формат flag{...}",
  6:  "Подсказка: подумай, куда мы тебя приглашаем.",
  10: "Подсказка: слова внутри фигурных скобок разделены нижним подчёркиванием.",
};
// Приводить ли ввод к нижнему регистру перед проверкой.
const CASE_INSENSITIVE = true;
/* ==================================================== */

const $ = id => document.getElementById(id);
const log = $("log"), input = $("code"), btn = $("btn"), term = $("term");
const KEY = "ctf_tries";
let tries = 0;
try { tries = parseInt(localStorage.getItem(KEY)) || 0; } catch(e) {}
$("tries").textContent = "Попыток: " + tries;

/* загрузочные строки */
const boot = [
  ["Инициализация терминала...", ""],
  ["Соединение установлено", "ok"],
  ["Требуется код доступа", "warn"],
];
(function typeLines(i){
  if(i >= boot.length){ log.insertAdjacentHTML("beforeend",'<span class="cur"></span>'); return; }
  const [txt, cls] = boot[i];
  const line = document.createElement("div");
  if(cls) line.className = cls;
  log.appendChild(line);
  let j = 0;
  (function ch(){
    line.textContent = "> " + txt.slice(0, ++j);
    if(j < txt.length) setTimeout(ch, 22); else setTimeout(() => typeLines(i+1), 180);
  })();
})(0);

function setLog(text, cls){
  log.innerHTML = '<div class="'+cls+'">&gt; '+text+'</div><span class="cur"></span>';
}

async function sha256(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,"0")).join("");
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  let val = input.value.trim();
  if(!val){ input.focus(); return; }
  if(CASE_INSENSITIVE) val = val.toLowerCase();

  btn.disabled = true;
  $("state").textContent = "Проверка...";
  setLog("Проверка кода...", "");
  await new Promise(r => setTimeout(r, 450));

  const h = await sha256(val);
  tries++;
  try { localStorage.setItem(KEY, tries); } catch(e) {}
  $("tries").textContent = "Попыток: " + tries;
  btn.disabled = false;

  if(ANSWER_HASHES.includes(h)){
    $("state").textContent = "Успех";
    setLog("Код принят. Доступ открыт.", "ok");
    $("winStat").textContent = "Попыток потребовалось: " + tries;
    setTimeout(() => $("win").classList.add("show"), 500);
  } else {
    $("state").textContent = "Неверный код";
    setLog("Неверный код. Попробуй ещё раз.", "err");
    term.classList.remove("shake"); void term.offsetWidth; term.classList.add("shake");
    if(HINTS[tries]) $("hint").textContent = HINTS[tries];
    input.select();
  }
});

/* фон «цифровой дождь» */
const c = $("rain"), ctx = c.getContext("2d");
const chars = "01アイウエオカキクケコABCDEF0123456789#$%&*";
let cols, drops, fs = 16;
function resize(){
  c.width = innerWidth; c.height = innerHeight;
  fs = innerWidth < 500 ? 13 : 16;
  cols = Math.floor(c.width / fs);
  drops = Array.from({length: cols}, () => Math.random() * -50);
}
resize(); addEventListener("resize", resize);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function draw(){
  ctx.fillStyle = "rgba(2,6,2,.08)"; ctx.fillRect(0,0,c.width,c.height);
  ctx.fillStyle = "#00ff66"; ctx.font = fs + "px monospace";
  for(let i=0;i<cols;i++){
    ctx.fillText(chars[Math.random()*chars.length|0], i*fs, drops[i]*fs);
    if(drops[i]*fs > c.height && Math.random() > .975) drops[i] = 0;
    drops[i]++;
  }
}
if(!reduce) setInterval(draw, 50);
</script>
